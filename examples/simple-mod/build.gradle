description = 'ReMod Simple Mod: items, blocks, a command, config and events.'

dependencies {
    // compileOnly, because ReMod provides the API at runtime. Bundling it into
    // a mod jar would load a second copy of every API class.
    compileOnly project(':remod-api')
    testImplementation project(':remod-api')
    testImplementation project(':remod-loader')
}

tasks.named('jar') {
    archiveBaseName = 'ReMod-Simple-Mod'
}

tasks.named('processResources') {
    inputs.property('modVersion', project.version)
    // The portable API baseline, so one jar covers every Minecraft version
    // the 'minecraft' range in remod.mod.json allows.
    inputs.property('apiBaseline', project.property('remodApiBaseline'))
    filesMatching('remod.mod.json') {
        expand(modVersion: project.version,
               apiBaseline: project.property('remodApiBaseline'))
    }
}
