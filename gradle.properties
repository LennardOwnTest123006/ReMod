# ---------------------------------------------------------------------------
# ReMod build properties
#
# Three *different* version numbers live in this project. Do not confuse them:
#   remodVersion      - the version of the ReMod loader/installer product itself
#   remodApiBaseline  - the baseline of the ReMod API; the effective API version
#                       a mod compiles against is "<mcSeries>-<remodApiBaseline>"
#                       (e.g. "1.21-1.0.0"), produced per Minecraft series.
#   minecraft version - never baked in here; discovered at runtime.
# ---------------------------------------------------------------------------
group=dev.remod
remodVersion=1.0.0
remodApiBaseline=1.0.0

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g
