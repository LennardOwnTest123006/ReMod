# Your mod's own version. Bump it when you release.
modVersion=1.0.0

# The ReMod API jar to compile against. The ReMod installer puts one here
# for every Minecraft version you install ReMod for.
remodApiPath=/root/.minecraft/remod/api/remod-api-1.21-1.0.0.jar

# Where './gradlew installMod' copies the built jar.
remodModsPath=/root/.minecraft/remod/mods

org.gradle.jvmargs=-Xmx1g
