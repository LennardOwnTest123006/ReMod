# Your mod's own version. Bump it when you release.
modVersion=1.0.0

# The ReMod API jar to compile against, put here by the ReMod installer.
# The same jar works for every Minecraft version, so this path does not
# change when you install ReMod for another one.
# NOTE: this file was not found when the project was generated. Install ReMod
#       for any Minecraft version, or edit the path below.
remodApiPath=/root/.minecraft/remod/api/remod-api-1.0.0.jar

# Where './gradlew installMod' copies the built jar.
remodModsPath=/root/.minecraft/remod/mods

org.gradle.jvmargs=-Xmx1g
