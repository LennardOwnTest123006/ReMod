description = 'The ReMod loader: mod discovery, dependency resolution, lifecycle and launch.'

dependencies {
    api project(':remod-api')
}

// The loader needs to know its own version at runtime, and hard-coding it in
// two places is how those two places drift apart. Generate it instead.
def generatedSources = layout.buildDirectory.dir('generated/sources/version')

tasks.register('generateVersionClass') {
    def loaderVersion = project.property('remodVersion').toString()
    def apiBaseline = project.property('remodApiBaseline').toString()
    def outputDir = generatedSources
    inputs.property('loaderVersion', loaderVersion)
    inputs.property('apiBaseline', apiBaseline)
    outputs.dir(outputDir)
    doLast {
        def target = outputDir.get().file('dev/remod/loader/BuildInfo.java').asFile
        target.parentFile.mkdirs()
        target.text = """package dev.remod.loader;

/** Build constants generated by Gradle. Do not edit by hand. */
public final class BuildInfo {

    /** The ReMod loader/installer version. */
    public static final String LOADER_VERSION = "${loaderVersion}";

    /** The ReMod API baseline; the effective API version is <series>-<baseline>. */
    public static final String API_BASELINE = "${apiBaseline}";

    private BuildInfo() {
    }
}
"""
    }
}

sourceSets.main.java.srcDir(generatedSources)
tasks.named('compileJava') { dependsOn 'generateVersionClass' }
tasks.named('sourcesJar') { dependsOn 'generateVersionClass' }
